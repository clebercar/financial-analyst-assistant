repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      # Roda o mypy do venv local (com TODAS as dependencias instaladas), em
      # vez do hook isolado do mirrors-mypy. Garante que o pre-commit pegue
      # os mesmos erros que o CI — incluindo conflitos de tipos entre
      # bibliotecas terceiras (ex: presidio-analyzer vs presidio-anonymizer).
      - id: mypy
        name: mypy (local venv)
        entry: mypy
        language: system
        types: [python]
        args: [src/, --ignore-missing-imports]
        pass_filenames: false
