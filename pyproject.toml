[project]
name = "financial-analyst-assistant"
version = "0.1.0"
description = "Conversational assistant for buy-side financial analysts (RAG + LSTM + sentiment + ReAct agent)"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Coleta de dados e API base
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
    "numpy>=1.26.0,<2.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.8.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "prometheus-client>=0.20.0",
    "joblib>=1.4.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    # ML clasico + tracking
    "torch>=2.2.0",
    "mlflow>=2.12.0",
    "pandera>=0.18.0",
    # datasets<4.0 obrigatorio: a v4 removeu suporte a loading scripts
    # (`trust_remote_code=True`), e o FinancialPhraseBank ainda e distribuido
    # como script no HF Hub.
    "datasets>=2.18.0,<4.0",
    # Agente + RAG + LLM
    "langchain>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "langchain-community>=0.2.0",
    "google-generativeai>=0.5.0",
    "chromadb>=0.5.0",
    "tiktoken>=0.7.0",
    "sec-edgar-downloader>=5.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    # Avaliacao + observabilidade
    "ragas>=0.1.10",
    "langfuse>=2.30.0",
    "evidently>=0.4.25",
    # Seguranca
    "presidio-analyzer>=2.2.354",
    "presidio-anonymizer>=2.2.354",
    "spacy>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "pre-commit>=3.7.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Convencao de ML: matrizes de features sao nomeadas X (maiusculo)
"src/models/*.py" = ["N806"]
"tests/test_preprocessing.py" = ["N806"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false  # ligar gradualmente

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__init__.py"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
